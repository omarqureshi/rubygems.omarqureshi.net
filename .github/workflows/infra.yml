name: infra

# The bucket, certificate, CloudFront distribution and DNS that serve this site,
# as a Ruby CDK app (infra/).
#
# Worth noticing what that means: the stack is written with the Ruby bindings
# published to the very feed it provisions, so this workflow is also a standing
# end-to-end test of those bindings against a real library. If a change to the
# Ruby target breaks aws-cdk-lib, this goes red.
#
# Synth runs on every push. Deploy is dispatch-only — it changes real
# infrastructure, and nothing here should move without someone asking.

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: apply the changes (otherwise this only shows a diff)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy && 'production' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install the jsii runtime sidecar
        working-directory: infra
        run: npm install

      - name: Install the Ruby CDK gems from the feed
        working-directory: infra
        run: bundle install

      - name: Synthesize
        # No credentials: Route53 lookups resolve to dummy values and CDK says
        # so. That is fine for what this checks — that the app runs and the
        # bindings produce a well-formed template. Whether the *deployed*
        # infrastructure is right is what the diff below is for.
        working-directory: infra
        env:
          JSII_RUNTIME: ${{ github.workspace }}/infra/node_modules/.bin/jsii-runtime
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1
          CDK_OUTDIR: cdk.out
        run: |
          bundle exec ruby app.rb
          test -f cdk.out/GemPublishingStack.template.json \
            || { echo "::error::no template produced"; exit 1; }
          ruby -rjson -e '
            t = JSON.parse(File.read("cdk.out/GemPublishingStack.template.json"))
            kinds = t["Resources"].values.map { |r| r["Type"] }.tally.sort
            kinds.each { |k, n| puts format("  %-40s %d", k, n) }
            bucket = t["Resources"].values.find { |r| r["Type"] == "AWS::S3::Bucket" }
            abort("::error::bucket is not versioned") unless
              bucket.dig("Properties", "VersioningConfiguration", "Status") == "Enabled"
            puts "bucket versioning: enabled"
          '

      - name: Configure AWS credentials
        if: github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Diff against what is deployed
        if: github.event_name == 'workflow_dispatch'
        working-directory: infra
        env:
          JSII_RUNTIME: ${{ github.workspace }}/infra/node_modules/.bin/jsii-runtime
        run: npx --yes aws-cdk diff || true

      - name: Deploy
        if: inputs.deploy
        working-directory: infra
        env:
          JSII_RUNTIME: ${{ github.workspace }}/infra/node_modules/.bin/jsii-runtime
        run: npx --yes aws-cdk deploy --require-approval never
