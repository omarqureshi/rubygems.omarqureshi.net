name: refresh

# Recomputes everything shared: the documentation aliases, the gem index, and
# the CloudFront cache.
#
# These are the objects several publishers would otherwise fight over. Each
# publisher writes only its own versioned prefix and then says it published
# something; this repository — which owns the shared paths — works out what
# that means. The alternative, publishers updating shared state directly, is a
# read-modify-write race and cannot be made safe by ordering alone.

on:
  repository_dispatch:
    types: [docs-published, gems-published]
  schedule:
    # A publisher cannot reliably reach this workflow: a cross-repository
    # dispatch needs a token with access here, and the default GITHUB_TOKEN is
    # scoped to the repository it runs in. Rather than require a PAT before
    # anything can be published, this also runs on a timer.
    #
    # Unattended, but not a publish: it only recomputes state derived from what
    # is already in the bucket, and doing so twice is the same as doing it once.
    # Nothing here can invent a version or ship a gem.
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: write the changes (otherwise this only reports what it would do)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  # Shared state has one writer at a time. Unlike a publisher's own prefix,
  # these objects genuinely cannot be written concurrently.
  group: shared-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    env:
      BUCKET: aws-cdk-ruby-gems
      # A dispatch is a publish that already happened, so it applies. A manual
      # run is a dry run unless asked otherwise.
      APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: What triggered this
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "${{ github.event.action }}: ${{ github.event.client_payload.library }} ${{ github.event.client_payload.version }}"
          else
            echo "manual run (apply=${{ inputs.apply }})"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Point each bare documentation URL at the right version
        run: |
          if [ "$APPLY" = "true" ]; then
            ruby docs-gen/update-aliases.rb "$BUCKET"
          else
            ruby docs-gen/update-aliases.rb "$BUCKET" --dry-run
          fi

      - name: Is the index already current?
        if: github.event.action != 'docs-published'
        run: |
          # Cheap check before the expensive work. This runs on a timer, and
          # almost every run has nothing to do: downloading every gem to rebuild
          # an identical index — and then invalidating a cache nobody needed
          # invalidated — would be pure waste, and would grow with the feed.
          #
          # Compares what the bucket holds against what the live index
          # advertises. Names only, which is all the index is keyed by.
          aws s3 ls "s3://$BUCKET/gems/" | awk '{print $4}' | sed 's/\.gem$//' | sort > /tmp/in-bucket
          curl -fsS "https://rubygems.omarqureshi.net/versions" 2>/dev/null \
            | tail -n +3 | awk '{n=$1; split($2,vs,","); for (i in vs) print n "-" vs[i]}' \
            | sed 's/-[0-9a-f]\{8,\}$//' | sort -u > /tmp/advertised || true
          if diff -q /tmp/in-bucket /tmp/advertised >/dev/null 2>&1; then
            echo "index is current ($(wc -l < /tmp/in-bucket) gems); nothing to rebuild"
            echo "INDEX_STALE=false" >> "$GITHUB_ENV"
          else
            echo "index differs from the bucket:"
            diff /tmp/advertised /tmp/in-bucket | head -10 || true
            echo "INDEX_STALE=true" >> "$GITHUB_ENV"
          fi

      - name: Rebuild the gem index
        if: github.event.action != 'docs-published' && env.INDEX_STALE == 'true'
        run: |
          # The index describes the whole feed, so it is rebuilt from what the
          # bucket actually holds rather than from what any one publisher
          # believes it added. Publishers only ever add .gem files.
          repo="${RUNNER_TEMP}/feed"
          mkdir -p "$repo/gems"
          aws s3 sync "s3://$BUCKET/gems/" "$repo/gems/" --no-progress
          echo "gems in the feed: $(ls "$repo/gems" | wc -l)"
          gem install rubygems-generate_index --no-document >/dev/null
          ( cd "$repo" && gem generate_index --directory . )

          ruby -rzlib -rstringio -e '
            repo = ENV.fetch("REPO")
            on_disk = Dir.glob(File.join(repo, "gems", "*.gem"))
                         .map { |f| File.basename(f, ".gem") }.sort
            indexed = %w[specs.4.8.gz prerelease_specs.4.8.gz].flat_map { |f|
              path = File.join(repo, f)
              next [] unless File.exist?(path)
              Marshal.load(Zlib::GzipReader.new(StringIO.new(File.binread(path))).read)
            }.map { |n, v, _| "#{n}-#{v}" }.sort
            missing = on_disk - indexed
            abort("::error::in the bucket but absent from the index: #{missing.join(", ")}") unless missing.empty?
            extra = indexed - on_disk
            abort("::error::indexed but not in the bucket: #{extra.join(", ")}") unless extra.empty?
            puts "index reconciles with the bucket: #{on_disk.size} gems"
          '
        env:
          REPO: ${{ runner.temp }}/feed

      - name: Upload the rebuilt index
        if: github.event.action != 'docs-published' && env.INDEX_STALE == 'true' && (github.event_name != 'workflow_dispatch' || inputs.apply)
        run: |
          repo="${RUNNER_TEMP}/feed"
          for f in specs.4.8 specs.4.8.gz latest_specs.4.8 latest_specs.4.8.gz \
                   prerelease_specs.4.8 prerelease_specs.4.8.gz names versions; do
            [ -f "$repo/$f" ] && aws s3 cp "$repo/$f" "s3://$BUCKET/$f" --no-progress >/dev/null
          done
          # quick/ and info/ are wholly derived from the gems, so --delete is
          # correct here and nowhere else: it is how a gem removed from the
          # feed stops being advertised.
          aws s3 sync "$repo/quick/" "s3://$BUCKET/quick/" --delete --no-progress
          aws s3 sync "$repo/info/" "s3://$BUCKET/info/" --delete --no-progress
          echo "index uploaded"

      - name: Deploy the stylesheets
        # The site's own assets, served from /styles/ and shared by every
        # library's pages. They were previously uploaded by the CDK publisher,
        # which was wrong for the same reason its index rebuild was — the files
        # describe the whole site, not one library — but removing that left them
        # with no owner at all, frozen at whatever was last pushed. This is the
        # owner.
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        run: |
          changed=false
          for css in docs-gen/*.css; do
            name=$(basename "$css")
            live=$(aws s3 cp "s3://$BUCKET/styles/$name" - 2>/dev/null || true)
            if [ "$live" != "$(cat "$css")" ]; then
              aws s3 cp "$css" "s3://$BUCKET/styles/$name" \
                --content-type 'text/css' --cache-control 'public, max-age=300' --no-progress >/dev/null
              echo "  updated styles/$name"
              changed=true
            fi
          done
          if [ "$changed" = "true" ]; then
            echo "STYLES_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "stylesheets already current"
          fi

      - name: Invalidate the caches that changed
        # Only what changed. A blanket /docs/* would throw away a warm cache for
        # thousands of immutable pages, and this also runs on a timer where the
        # usual answer is "nothing".
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        env:
          LIBRARY: ${{ github.event.client_payload.library }}
          PUBLISHED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items || \`[]\`, 'rubygems.omarqureshi.net')].Id | [0]" \
            --output text)
          if [ "$DIST_ID" = "None" ] || [ -z "$DIST_ID" ]; then
            echo "no distribution for rubygems.omarqureshi.net; nothing to invalidate"
            exit 0
          fi

          paths=()

          # Shared, mutable, and only worth invalidating when they moved.
          if [ "$STYLES_CHANGED" = "true" ]; then
            paths+=('/styles/*')
          fi

          if [ "$INDEX_STALE" = "true" ] || [ "$ALIASES_CHANGED" = "true" ]; then
            paths+=('/docs/*/index.html' '/docs/*/*/index.html'
                    '/specs*' '/latest_specs*' '/prerelease_specs*' '/names' '/versions'
                    '/info/*' '/quick/*')
          fi

          # A version prefix is immutable in normal operation, so it is never
          # invalidated on a timer. But a publisher that names a library and
          # version has just written there — which happens when a release is
          # deliberately rebuilt to fix a bug in the pages themselves. Skipping
          # it then serves the broken pages until the cache expires: exactly what
          # happened to /docs/Constructs/10.8.1/, which kept sending readers to
          # an AWSCDK directory for an hour after the fix was published.
          if [ -n "$LIBRARY" ] && [ -n "$PUBLISHED_VERSION" ]; then
            paths+=("/docs/${LIBRARY}/${PUBLISHED_VERSION}/*")
            echo "a publisher wrote to docs/${LIBRARY}/${PUBLISHED_VERSION}/"
          fi

          if [ ${#paths[@]} -eq 0 ]; then
            echo "nothing changed; leaving the cache alone"
            exit 0
          fi
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" \
            --paths "${paths[@]}" >/dev/null
          printf '  %s\n' "${paths[@]}"
          echo "invalidated ${#paths[@]} path pattern(s) on $DIST_ID"
